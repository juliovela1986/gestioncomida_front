name: gestioncomida_front
description: "Organizador de alimentos"
publish_to: 'none'
version: 1.0.1+3

environment:
  sdk: '>=2.19.0 <3.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_secure_storage: ^10.0.0
  dio: ^5.4.0
  webview_flutter: ^4.0.0
  crypto: ^3.0.3
  image_picker: ^1.0.4
  image: ^4.8.0
  intl: ^0.20.2
  file_picker: ^10.3.10
  firebase_core: ^4.5.0
  firebase_messaging: ^16.1.2
  shared_preferences: ^2.2.2
  provider: ^6.1.1
  receive_sharing_intent: ^1.5.3
  speech_to_text: ^7.0.0

  http: ^1.6.0
  path_provider: ^2.1.5
  flutter_dotenv: ^6.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/branding/scanticketfresh-icon-launcher-1024.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/branding/scanticketfresh-icon-launcher-1024.png
  # 0: el asset ya ocupa ~88% del canvas; el 16% default dejaba el logo minúsculo
  adaptive_icon_foreground_inset: 0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/branding/
